<!--APP {"name":"Crypto Ticker","icon":"📈"}-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Ticker</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Crypto Ticker</h1>
            <button id="refreshBtn" class="refresh-btn">Refresh</button>
        </header>

        <div class="message-zone" id="messageZone"></div>

        <div class="cards-grid">
            <div class="price-card" id="bitcoinCard">
                <div class="crypto-name">Bitcoin</div>
                <div class="crypto-ticker">BTC</div>
                <div class="price-display">
                    <span class="direction-indicator" id="bitcoinIndicator">—</span>
                    <span class="price" id="bitcoinPrice">—</span>
                </div>
                <div class="timestamp" id="bitcoinTime"></div>
            </div>

            <div class="price-card" id="ethereumCard">
                <div class="crypto-name">Ethereum</div>
                <div class="crypto-ticker">ETH</div>
                <div class="price-display">
                    <span class="direction-indicator" id="ethereumIndicator">—</span>
                    <span class="price" id="ethereumPrice">—</span>
                </div>
                <div class="timestamp" id="ethereumTime"></div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
