<!--APP {"name":"Trash","icon":"🗑️"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#0f1018;color:#eee;font-family:system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
header h1{font-size:16px;margin:0;flex:1}
button{border:none;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.empty-btn{background:#3a1a1f;color:#ff9d96}.refresh{background:#2a2d40;color:#eee}
.list{flex:1;overflow:auto;padding:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px}
.row:hover{background:rgba(255,255,255,.05)}
.ico{font-size:20px}.info{flex:1;min-width:0}
.name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.from{font-size:11px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restore{background:#1d3326;color:#8ff0bb}
.none{opacity:.5;text-align:center;padding:34px;font-size:14px}
</style></head><body>
<header><span style="font-size:20px">🗑️</span><h1>Trash</h1><button class="refresh" id="refresh">Refresh</button><button class="empty-btn" id="empty">Empty Trash</button></header>
<div class="list" id="list"></div>
<script>
var os=window.os;
function when(ts){if(!ts)return '';var s=Math.round((Date.now()-ts)/1000);if(s<60)return s+'s ago';var m=Math.round(s/60);if(m<60)return m+'m ago';var h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';}
function render(items){var l=document.getElementById('list');l.innerHTML='';if(!items||!items.length){l.innerHTML='<div class="none">Trash is empty.</div>';return;}items.forEach(function(it){var row=document.createElement('div');row.className='row';var ic=document.createElement('div');ic.className='ico';ic.textContent=it.type==='dir'?'📁':'📄';var info=document.createElement('div');info.className='info';var nm=document.createElement('div');nm.className='name';nm.textContent=it.name;var fr=document.createElement('div');fr.className='from';fr.textContent=(it.trashedFrom||'')+'  ·  '+when(it.trashedAt);info.appendChild(nm);info.appendChild(fr);var rb=document.createElement('button');rb.className='restore';rb.textContent='Restore';rb.onclick=function(){os.fs.restore(it.path).then(refresh);};row.appendChild(ic);row.appendChild(info);row.appendChild(rb);l.appendChild(row);});}
function refresh(){if(!os){render([]);return;}os.fs.listTrash().then(render);}
document.getElementById('refresh').onclick=refresh;
document.getElementById('empty').onclick=function(){if(window.confirm('Permanently delete all items in Trash?')){os.fs.emptyTrash().then(refresh);}};
refresh();
</script></body></html>
