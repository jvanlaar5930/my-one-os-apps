<!--APP {"name":"Card Match Champion","icon":"🎮"}-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Match Champion</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎮 Card Match Champion</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="game">Game</button>
      <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
    </div>

    <!-- GAME TAB -->
    <div id="game-tab" class="tab-content active">
      <div class="game-section">
        <div class="difficulty-selector">
          <label>Difficulty:</label>
          <select id="difficulty-select">
            <option value="easy">Easy (4×4)</option>
            <option value="medium">Medium (4×6)</option>
            <option value="hard">Hard (6×6)</option>
            <option value="extreme">Extreme (8×8)</option>
          </select>
          <button id="start-game-btn">Start Game</button>
        </div>

        <div id="game-board" class="game-board hidden">
          <div class="game-stats">
            <div class="stat">
              <span class="stat-label">Time:</span>
              <span id="timer">0:00</span>
            </div>
            <div class="stat">
              <span class="stat-label">Moves:</span>
              <span id="move-count">0</span>
            </div>
          </div>

          <div id="card-grid" class="card-grid"></div>
        </div>
      </div>
    </div>

    <!-- LEADERBOARD TAB -->
    <div id="leaderboard-tab" class="tab-content">
      <div class="leaderboard-section">
        <div class="leaderboard-filters">
          <label>Difficulty:</label>
          <select id="difficulty-filter">
            <option value="">All</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="extreme">Extreme</option>
          </select>

          <label>Show Top 10</label>
          <input type="checkbox" id="top-10-filter" checked>

          <button id="refresh-leaderboard-btn">Refresh</button>
        </div>

        <div class="stats-dashboard">
          <h3>Quick Stats</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="best-time">-</div>
              <div class="stat-name">Best Time</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="avg-score">-</div>
              <div class="stat-name">Avg Score</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="total-games">0</div>
              <div class="stat-name">Games Played</div>
            </div>
          </div>
        </div>

        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th class="sortable" data-sort="score">Score</th>
              <th class="sortable" data-sort="timeSeconds">Time</th>
              <th class="sortable" data-sort="difficulty">Difficulty</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- POST-GAME MODAL -->
  <div id="game-over-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Game Complete!</h2>
      <div id="game-result">
        <p>Time: <strong id="result-time">0:00</strong></p>
        <p>Moves: <strong id="result-moves">0</strong></p>
        <p>Score: <strong id="result-score">0</strong></p>
      </div>
      <div class="modal-input">
        <label>Player Name:</label>
        <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="50">
      </div>
      <div class="modal-actions">
        <button id="save-score-btn">Save & Continue</button>
        <button id="cancel-score-btn">Discard</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
