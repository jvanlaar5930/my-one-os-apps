<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Randy's Roundup</title>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="startMenu" class="overlay">
  <h1>RANDY'S ROUNDUP</h1>
  <div class="stat-box">
    <p><strong>Controls:</strong></p>
    <p>A / D or ← / → to Move</p>
    <p>W / S or ↑ / ↓ to Jump / Crouch</p>
    <p>SPACE to Jump</p>
  </div>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameOverMenu" class="overlay hidden">
  <h1>GAME OVER!</h1>
  <div class="stat-box">
    <p id="goTime"></p>
    <p id="goCoins"></p>
    <p id="goScore" style="font-size: 24px; color: #ffd700; margin-top: 10px;"></p>
    <p id="goHighScore" style="font-size: 16px; color: #aaa;"></p>
  </div>
  <button id="restartBtn">Try Again</button>
</div>


  <script src="./app.js"></script>
</body>
</html>
