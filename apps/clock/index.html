<!--APP {"name":"Clock","icon":"⏰"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#0f1018;color:#eee;font-family:system-ui,Segoe UI,sans-serif}
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.1)}
.tabs button{flex:1;background:transparent;border:none;color:#888;padding:11px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.tabs button.active{color:#fff;border-bottom-color:#7c5cff}
.pane{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pane.active{display:flex}
.big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{opacity:.6}
.row{display:flex;gap:8px;align-items:center}
.act{border:none;border-radius:10px;padding:9px 16px;background:#7c5cff;color:#fff;cursor:pointer;font-size:14px}
.act.sec{background:#2a2d40}
input{width:60px;background:#1c1e2b;border:1px solid rgba(255,255,255,.15);color:#eee;border-radius:8px;padding:8px;font-size:16px;text-align:center}
.laps{max-height:28%;overflow:auto;font-size:13px;opacity:.8}
@keyframes flash{50%{background:#3a1a1f}}
</style></head><body>
<div class="tabs"><button class="active" data-t="clock">Clock</button><button data-t="sw">Stopwatch</button><button data-t="timer">Timer</button></div>
<div class="pane active" id="clock"><div class="big" id="ctime"></div><div class="sub" id="cdate"></div></div>
<div class="pane" id="sw"><div class="big" id="swt">00:00.0</div><div class="row"><button class="act" id="swstart">Start</button><button class="act sec" id="swlap">Lap</button><button class="act sec" id="swreset">Reset</button></div><div class="laps" id="laps"></div></div>
<div class="pane" id="timer"><div class="big" id="tt">05:00</div><div class="row"><input id="tmin" value="5"> min <input id="tsec" value="0"> sec</div><div class="row"><button class="act" id="tstart">Start</button><button class="act sec" id="treset">Reset</button></div></div>
<script>
var os=window.os;
var tabs=document.querySelectorAll('.tabs button');tabs.forEach(function(b){b.onclick=function(){tabs.forEach(function(x){x.classList.remove('active');});b.classList.add('active');document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('active');});document.getElementById(b.dataset.t).classList.add('active');};});
function two(n){return (n<10?'0':'')+n;}
setInterval(function(){var d=new Date();document.getElementById('ctime').textContent=two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());document.getElementById('cdate').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});},250);
var swEl=document.getElementById('swt'),swRun=false,swStart=0,swAcc=0,swInt=null;
function swFmt(ms){var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,t=Math.floor(ms/100)%10;return two(m)+':'+two(s)+'.'+t;}
function swTick(){swEl.textContent=swFmt(swAcc+(swRun?Date.now()-swStart:0));}
document.getElementById('swstart').onclick=function(){if(swRun){swAcc+=Date.now()-swStart;swRun=false;clearInterval(swInt);this.textContent='Start';}else{swRun=true;swStart=Date.now();swInt=setInterval(swTick,50);this.textContent='Stop';}};
document.getElementById('swlap').onclick=function(){var d=document.createElement('div');d.textContent='Lap '+swFmt(swAcc+(swRun?Date.now()-swStart:0));document.getElementById('laps').appendChild(d);};
document.getElementById('swreset').onclick=function(){swRun=false;clearInterval(swInt);swAcc=0;swEl.textContent='00:00.0';document.getElementById('laps').innerHTML='';document.getElementById('swstart').textContent='Start';};
var tEl=document.getElementById('tt'),tRun=false,tEnd=0,tInt=null,tRem=300000;
function tFmt(ms){if(ms<0)ms=0;var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return two(m)+':'+two(s);}
function setFromInputs(){tRem=(parseInt(document.getElementById('tmin').value||0,10)*60+parseInt(document.getElementById('tsec').value||0,10))*1000;}
function tTick(){tRem=tEnd-Date.now();if(tRem<=0){tRem=0;clearInterval(tInt);tRun=false;document.getElementById('tstart').textContent='Start';tEl.textContent='00:00';document.body.style.animation='flash .4s 6';setTimeout(function(){document.body.style.animation='';},2600);if(os&&os.notify)os.notify('Timer done!');return;}tEl.textContent=tFmt(tRem);}
document.getElementById('tstart').onclick=function(){if(tRun){tRun=false;clearInterval(tInt);this.textContent='Start';}else{if(tRem<=0||tEl.textContent==='00:00')setFromInputs();tEnd=Date.now()+tRem;tRun=true;tInt=setInterval(tTick,200);this.textContent='Pause';}};
document.getElementById('treset').onclick=function(){tRun=false;clearInterval(tInt);setFromInputs();tEl.textContent=tFmt(tRem);document.getElementById('tstart').textContent='Start';};
</script></body></html>
