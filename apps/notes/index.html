<!--APP {"name":"Notes","icon":"📝"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:#0f1018;color:#eee;font-family:system-ui,Segoe UI,sans-serif}
.side{width:40%;max-width:240px;border-right:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.side .top{padding:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.newbtn{border:none;border-radius:8px;padding:8px;background:#7c5cff;color:#fff;cursor:pointer;font-size:13px;width:100%}
.list{flex:1;overflow:auto}
.item{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.item:hover{background:rgba(255,255,255,.06)}.item.active{background:rgba(124,92,255,.25)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.item .p{opacity:.55;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column}
.main input{background:transparent;border:none;color:#eee;font-size:18px;font-weight:600;padding:12px;outline:none}
.main textarea{flex:1;background:transparent;border:none;color:#ddd;padding:0 12px 12px;font-size:14px;line-height:1.5;resize:none;outline:none;font-family:inherit}
.del{border:none;border-radius:8px;background:#3a1a1f;color:#ff9d96;cursor:pointer;font-size:12px;padding:6px 10px;margin:8px 12px;align-self:flex-start}
.empty{flex:1;display:flex;align-items:center;justify-content:center;opacity:.5}
</style></head><body>
<div class="side"><div class="top"><button class="newbtn" id="new">+ New note</button></div><div class="list" id="list"></div></div>
<div class="main" id="main"></div>
<script>
var os=window.os;var notes=[];var curId=null;
function uid(){return 'n'+Date.now()+Math.floor(Math.random()*999);}
function load(){if(!os)return Promise.resolve();return os.storage.get('notes').then(function(n){notes=n||[];});}
function save(){if(os)os.storage.set('notes',notes);}
function renderList(){var l=document.getElementById('list');l.innerHTML='';notes.slice().sort(function(a,b){return b.updated-a.updated;}).forEach(function(n){var d=document.createElement('div');d.className='item'+(n.id===curId?' active':'');var t=document.createElement('div');t.className='t';t.textContent=n.title||'Untitled';var p=document.createElement('div');p.className='p';p.textContent=(n.body||'').slice(0,40)||'No additional text';d.appendChild(t);d.appendChild(p);d.onclick=function(){curId=n.id;renderList();renderMain();};l.appendChild(d);});}
function renderMain(){var m=document.getElementById('main');var n=notes.filter(function(x){return x.id===curId;})[0];if(!n){m.innerHTML='<div class="empty">Select or create a note</div>';return;}m.innerHTML='';var ti=document.createElement('input');ti.value=n.title;ti.placeholder='Title';var ta=document.createElement('textarea');ta.value=n.body;ta.placeholder='Write something...';var del=document.createElement('button');del.className='del';del.textContent='Delete note';ti.oninput=function(){n.title=ti.value;n.updated=Date.now();save();renderList();};ta.oninput=function(){n.body=ta.value;n.updated=Date.now();save();};del.onclick=function(){notes=notes.filter(function(x){return x.id!==n.id;});curId=null;save();renderList();renderMain();};m.appendChild(ti);m.appendChild(ta);m.appendChild(del);}
document.getElementById('new').onclick=function(){var n={id:uid(),title:'',body:'',updated:Date.now()};notes.push(n);curId=n.id;save();renderList();renderMain();var inp=document.querySelector('.main input');if(inp)inp.focus();};
load().then(function(){renderList();renderMain();});
</script></body></html>
