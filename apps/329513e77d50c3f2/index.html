<!--APP {"name":"PixelCraft Pro","icon":"🎨"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:monospace;display:flex;flex-direction:column;height:100vh}#toolbar{display:flex;flex-direction:column;width:60px;background:#333;padding:5px 0;border-right:1px solid #555;gap:5px}#canvas-container{flex:1;overflow:auto;display:flex;justify-content:center;align-items:center;background:#222}canvas{image-rendering:pixelated;cursor:pointer}#status-bar{background:#333;color:white;padding:5px;font-size:14px;text-align:center;border-top:1px solid #555}</style></head><body><div id="toolbar"><button id="brush-tool">✏️</button><button id="eraser-tool">🧽</button><button id="clear-btn">🗑️</button><button id="grid-toggle">🔲</button><input type="color" id="color-picker" value="#000000"></div><div id="canvas-container"><canvas id="main-canvas" width="320" height="320"></canvas></div><div id="status-bar">Ready</div><script>const canvas=document.getElementById('main-canvas');const ctx=canvas.getContext('2d');const toolbar=document.getElementById('toolbar');const colorPicker=document.getElementById('color-picker');const statusBar=document.getElementById('status-bar');let isDrawing=false;let currentTool='brush';let gridSize=16;let gridVisible=true;let undoStack=[];let redoStack=[];let lastX=0;let lastY=0;function updateStatusBar(x,y){statusBar.textContent=`Position: ${x},${y}`;}function drawPixel(x,y,color){ctx.fillStyle=color;ctx.fillRect(x*gridSize,y*gridSize,gridSize,gridSize);}function getGridCoordinates(x,y){return{gridX:Math.floor(x/gridSize),gridY:Math.floor(y/gridSize)}}function handleMouseDown(e){isDrawing=true;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;const gridCoords=getGridCoordinates(x,y);lastX=gridCoords.gridX;lastY=gridCoords.gridY;if(currentTool==='brush'){drawPixel(gridCoords.gridX,gridCoords.gridY,colorPicker.value);}else if(currentTool==='eraser'){drawPixel(gridCoords.gridX,gridCoords.gridY,'#FFFFFF');}}function handleMouseMove(e){if(!isDrawing)return;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;const gridCoords=getGridCoordinates(x,y);if(gridCoords.gridX===lastX&&gridCoords.gridY===lastY)return;lastX=gridCoords.gridX;lastY=gridCoords.gridY;if(currentTool==='brush'){drawPixel(gridCoords.gridX,gridCoords.gridY,colorPicker.value);}else if(currentTool==='eraser'){drawPixel(gridCoords.gridX,gridCoords.gridY,'#FFFFFF');}}function handleMouseUp(){isDrawing=false;}canvas.addEventListener('mousedown',handleMouseDown);canvas.addEventListener('mousemove',handleMouseMove);canvas.addEventListener('mouseup',handleMouseUp);toolbar.addEventListener('click',(e)=>{if(e.target.id==='brush-tool'){currentTool='brush';}else if(e.target.id==='eraser-tool'){currentTool='eraser';}else if(e.target.id==='clear-btn'){ctx.clearRect(0,0,canvas.width,canvas.height);}else if(e.target.id==='grid-toggle'){gridVisible=!gridVisible;}});colorPicker.addEventListener('input',()=>{if(currentTool==='brush'){drawPixel(lastX,lastY,colorPicker.value);}});</script></body></html>
