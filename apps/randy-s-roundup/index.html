<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randy's Roundup</title>
    <style>
        :root {
            --desert-sand: #edc9af;
            --sky-blue: #87ceeb;
            --sunset-orange: #ff8c00;
            --ui-panel: rgba(0, 0, 0, 0.8);
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 450px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(to bottom, #87ceeb 0%, #fdb813 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            z-index: 10;
        }

        .menu-panel {
            background: var(--ui-panel);
            padding: 2rem;
            border-radius: 15px;
            border: 3px solid #d2691e;
            min-width: 280px;
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 2.5rem;
            color: #ffcc33;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 2px;
        }

        .stats-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .controls-hint {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: #d2691e;
            color: white;
            border: none;
            border-radius: 8px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #8b4513;
        }

        button:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #8b4513;
        }

        .hidden {
            display: none !important;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.7);
            font-size: 1.1rem;
        }

        .score-val {
            color: #ffcc33;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">
        <div>Score: <span id="hud-score" class="score-val">0</span></div>
        <div>Coins: <span id="hud-coins" class="score-val">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Menu -->
    <div id="start-menu" class="overlay">
        <div class="menu-panel">
            <h1>Randy's Roundup</h1>
            <div class="stats-text">Ready to ride, Cowboy?</div>
            <div class="controls-hint">
                <b>Controls:</b><br>
                SPACE / UP / W: Jump<br>
                A / D / Left / Right: Move<br>
                (Avoid cacti & rocks!)
            </div>
            <button id="start-btn">START GAME</button>
        </div>
        <div style="position: absolute; bottom: 20px; right: 20px; font-size: 1.5rem; opacity: 0.3;">Randy</div>
    </div>

    <!-- Game Over Summary -->
    <div id="game-over" class="overlay hidden">
        <div class="menu-panel">
            <h1>Wasted!</h1>
            <div id="summary-content" class="stats-text">
                <!-- Populated by JS -->
            </div>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>
</div>
