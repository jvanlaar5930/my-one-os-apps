<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background: #1e1e1e;
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .calculator-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .display {
            background: #2d2d2d;
            padding: 20px;
            text-align: right;
            border-bottom: 1px solid #3d3d3d;
            flex-shrink: 0;
        }
        
        .previous-operand {
            font-size: 1.2rem;
            color: #aaa;
            min-height: 1.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .current-operand {
            font-size: 2.5rem;
            font-weight: 300;
            margin-top: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #3d3d3d;
            flex-grow: 1;
            overflow: hidden;
        }
        
        button {
            background: #2d2d2d;
            border: none;
            padding: 20px 10px;
            font-size: 1.5rem;
            color: #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        
        button:hover {
            background: #3d3d3d;
        }
        
        button:active {
            background: #4d4d4d;
        }
        
        .operator {
            background: #3d3d3d;
            font-weight: 500;
        }
        
        .operator:hover {
            background: #4d4d4d;
        }
        
        .equals {
            background: #ff9500;
            grid-column: span 2;
        }
        
        .equals:hover {
            background: #ffaa33;
        }
        
        .clear, .delete {
            background: #a5a5a5;
            color: #1e1e1e;
        }
        
        .clear:hover, .delete:hover {
            background: #d4d4d4;
        }
        
        .history-panel {
            background: #2d2d2d;
            border-top: 1px solid #3d3d3d;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .history-panel.active {
            display: block;
        }
        
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #3d3d3d;
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        @media (max-width: 480px) {
            button {
                padding: 15px 5px;
                font-size: 1.3rem;
            }
            
            .current-operand {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        
        <div class="buttons-grid">
            <button class="clear" data-action="clear">C</button>
            <button class="delete" data-action="delete">DEL</button>
            <button class="operator" data-operation="%">%</button>
            <button class="operator" data-operation="÷">÷</button>
            
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operation="×">×</button>
            
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operation="-">−</button>
            
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operation="+">+</button>
            
            <button data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="equals" data-action="calculate">=</button>
        </div>
        
        <div class="history-panel" id="history-panel">
            <div class="history-title">History</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // Calculator state
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let resetScreen = false;
        
        // DOM elements
        const currentOperandElement = document.getElementById('current-operand');
        const previousOperandElement = document.getElementById('previous-operand');
        const historyListElement = document.getElementById('history-list');
        const historyPanelElement = document.getElementById('history-panel');
        
        // Update display
        function updateDisplay() {
            currentOperandElement.innerText = currentOperand;
            if (operation != null) {
                previousOperandElement.innerText = `${previousOperand} ${getOperationSymbol(operation)}`;
            } else {
                previousOperandElement.innerText = previousOperand;
            }
        }
        
        // Get symbol for operation
        function getOperationSymbol(op) {
            switch(op) {
                case '+': return '+';
                case '-': return '−';
                case '×': return '×';
                case '÷': return '÷';
                case '%': return '%';
                default: return op;
            }
        }
        
        // Append number
        function appendNumber(number) {
            if (resetScreen) {
                currentOperand = '0';
                resetScreen = false;
            }
            
            if (number === '.' && currentOperand.includes('.')) return;
            
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand += number;
            }
        }
        
        // Choose operation
        function chooseOperation(op) {
            if (currentOperand === '') return;
            
            if (previousOperand !== '') {
                calculate();
            }
            
            operation = op;
            previousOperand = currentOperand;
            resetScreen = true;
        }
        
        // Calculate
        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        computation = 'Error';
                    } else {
                        computation = prev / current;
                    }
                    break;
                case '%':
                    computation = prev % current;
                    break;
                default:
                    return;
            }
            
            // Add to history
            addToHistory(`${previousOperand} ${getOperationSymbol(operation)} ${currentOperand} = ${computation}`);
            
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            resetScreen = true;
        }
        
        // Clear calculator
        function clear() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }
        
        // Delete last character
        function deleteNumber() {
            if (currentOperand.length === 1) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
        }
        
        // Add to history
        function addToHistory(calculation) {
            const history = JSON.parse(localStorage.getItem('calculatorHistory') || '[]');
            history.push({
                expression: calculation,
                timestamp: new Date().toISOString()
            });
            
            // Keep only last 20 items
            if (history.length > 20) {
                history.shift();
            }
            
            localStorage.setItem('calculatorHistory', JSON.stringify(history));
            updateHistoryDisplay();
        }
        
        // Update history display
        function updateHistoryDisplay() {
            const history = JSON.parse(localStorage.getItem('calculatorHistory') || '[]');
            historyListElement.innerHTML = '';
            
            if (history.length === 0) {
                historyListElement.innerHTML = '<div class="history-item">No history yet</div>';
                return;
            }
            
            history.slice().reverse().forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = item.expression;
                historyListElement.appendChild(historyItem);
            });
        }
        
        // Load history on startup
        updateHistoryDisplay();
        
        // Event listeners for buttons
        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                appendNumber(button.getAttribute('data-number'));
                updateDisplay();
            });
        });
        
        document.querySelectorAll('[data-operation]').forEach(button => {
            button.addEventListener('click', () => {
                chooseOperation(button.getAttribute('data-operation'));
                updateDisplay();
            });
        });
        
        document.querySelector('[data-action="calculate"]').addEventListener('click', () => {
            calculate();
            updateDisplay();
        });
        
        document.querySelector('[data-action="clear"]').addEventListener('click', () => {
            clear();
            updateDisplay();
        });
        
        document.querySelector('[data-action="delete"]').addEventListener('click', () => {
            deleteNumber();
            updateDisplay();
        });
        
        // Keyboard support
        document.addEventListener('keydown', event => {
            if (event.key >= '0' && event.key <= '9') {
                appendNumber(event.key);
                updateDisplay();
            }
            if (event.key === '.') {
                appendNumber('.');
                updateDisplay();
            }
            if (event.key === '+' || event.key === '-') {
                chooseOperation(event.key);
                updateDisplay();
            }
            if (event.key === '*') {
                chooseOperation('×');
                updateDisplay();
            }
            if (event.key === '/') {
                chooseOperation('÷');
                updateDisplay();
            }
            if (event.key === '%') {
                chooseOperation('%');
                updateDisplay();
            }
            if (event.key === 'Enter' || event.key === '=') {
                calculate();
                updateDisplay();
            }
            if (event.key === 'Escape') {
                clear();
                updateDisplay();
            }
            if (event.key === 'Backspace') {
                deleteNumber();
                updateDisplay();
            }
        });
        
        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
