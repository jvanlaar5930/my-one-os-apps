<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 12px 16px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3d3d3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 18px;
            font-weight: 500;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 250px;
            background-color: #252525;
            border-right: 1px solid #3d3d3d;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .file-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 8px;
        }
        
        .file-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .file-item:hover {
            background-color: #3d3d3d;
        }
        
        .file-item.selected {
            background-color: #3d5a80;
        }
        
        .file-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }
        
        .image-display {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            cursor: grab;
        }
        
        .image-display.dragging {
            cursor: grabbing;
        }
        
        .metadata {
            padding: 12px;
            background-color: #252525;
            border-top: 1px solid #3d3d3d;
            font-size: 14px;
            word-break: break-all;
        }
        
        .toolbar {
            padding: 12px;
            background-color: #252525;
            border-top: 1px solid #3d3d3d;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn {
            background-color: #3d3d3d;
            color: #e0e0e0;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover {
            background-color: #4d4d4d;
        }
        
        .btn.active {
            background-color: #3d5a80;
        }
        
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .zoom-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
        }
        
        .empty-state img {
            width: 100px;
            opacity: 0.5;
            margin-bottom: 16px;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3d3d3d;
            border-top: 4px solid #3d5a80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Paint Viewer</div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <h3>Files</h3>
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div class="main-view">
            <div class="image-container" id="imageContainer">
                <div class="empty-state" id="emptyState">
                    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJkMmQyZCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIwIiBmaWxsPSIjM2QzZDNkIi8+PC9zdmc+" alt="No images">
                    <p>No images loaded</p>
                    <p>Select an image from the sidebar to view it</p>
                </div>
            </div>
            
            <div class="metadata" id="metadata">
                Select an image to see metadata
            </div>
            
            <div class="toolbar">
                <button class="btn" id="rotateLeftBtn">
                    <span>↺</span> Rotate Left
                </button>
                <button class="btn" id="rotateRightBtn">
                    <span>↻</span> Rotate Right
                </button>
                <button class="btn" id="flipHorizontalBtn">
                    <span>↔️</span> Flip Horizontal
                </button>
                <button class="btn" id="flipVerticalBtn">
                    <span>↕️</span> Flip Vertical
                </button>
                <div class="zoom-controls">
                    <button class="btn zoom-btn" id="zoomInBtn">+</button>
                    <button class="btn zoom-btn" id="zoomOutBtn">-</button>
                    <button class="btn zoom-btn" id="resetZoomBtn">↺</button>
                </div>
                <button class="btn" id="saveBtn">
                    <span>💾</span> Save As
                </button>
            </div>
        </div>
    </div>

    <script>
        // App state
        let currentImage = null;
        let currentFile = null;
        let imageCache = {};
        let zoomLevel = 1;
        let rotation = 0;
        let flipX = false;
        let flipY = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let startX = 0;
        let startY = 0;
        
        // DOM elements
        const fileListElement = document.getElementById('fileList');
        const imageContainer = document.getElementById('imageContainer');
        const imageDisplay = document.createElement('img');
        const metadataElement = document.getElementById('metadata');
        const emptyState = document.getElementById('emptyState');
        
        // Toolbar buttons
        const rotateLeftBtn = document.getElementById('rotateLeftBtn');
        const rotateRightBtn = document.getElementById('rotateRightBtn');
        const flipHorizontalBtn = document.getElementById('flipHorizontalBtn');
        const flipVerticalBtn = document.getElementById('flipVerticalBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const resetZoomBtn = document.getElementById('resetZoomBtn');
        const saveBtn = document.getElementById('saveBtn');
        
        // Initialize the app
        async function init() {
            if (window.os) {
                try {
                    await loadImages();
                    setupEventListeners();
                } catch (error) {
                    console.error('Error initializing app:', error);
                }
            } else {
                // Fallback for testing outside OS
                populateSampleFiles();
                setupEventListeners();
            }
        }
        
        // Load images from storage
        async function loadImages() {
            try {
                const files = await os.fs.list('/');
                const imageFiles = files.filter(file => 
                    file.name.toLowerCase().endsWith('.png') || 
                    file.name.toLowerCase().endsWith('.jpg') ||
                    file.name.toLowerCase().endsWith('.jpeg')
                );
                
                if (imageFiles.length === 0) {
                    emptyState.innerHTML = `
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJkMmQyZCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIwIiBmaWxsPSIjM2QzZDNkIi8+PC9zdmc+" alt="No images">
                        <p>No Paint images found</p>
                        <p>Save some PNG or JPG files with Paint to view them here</p>
                    `;
                    return;
                }
                
                renderFileList(imageFiles);
            } catch (error) {
                console.error('Error loading files:', error);
                emptyState.innerHTML = `
                    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJkMmQyZCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIwIiBmaWxsPSIjM2QzZDNkIi8+PC9zdmc+" alt="Error">
                    <p>Error loading files</p>
                `;
            }
        }
        
        // Render file list
        function renderFileList(files) {
            fileListElement.innerHTML = '';
            
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.dataset.path = file.path;
                
                const icon = file.name.toLowerCase().endsWith('.png') ? '🖼️' : '📷';
                fileItem.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span>${file.name}</span>
                `;
                
                fileItem.addEventListener('click', () => {
                    loadFile(file.path);
                });
                
                fileListElement.appendChild(fileItem);
            });
        }
        
        // Load a specific file
        async function loadFile(path) {
            try {
                showLoading();
                
                const file = await os.fs.read(path);
                if (!file) {
                    throw new Error('Failed to read file');
                }
                
                // Update UI
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('selected');
                });
                document.querySelector(`[data-path="${path}"]`).classList.add('selected');
                
                currentFile = path;
                currentImage = new Image();
                
                const blob = new Blob([file], { type: 'image/png' });
                const url = URL.createObjectURL(blob);
                
                currentImage.onload = () => {
                    // Reset transformations
                    zoomLevel = 1;
                    rotation = 0;
                    flipX = false;
                    flipY = false;
                    
                    // Display image
                    displayImage(url);
                    updateMetadata(path, currentImage);
                    hideLoading();
                };
                
                currentImage.onerror = () => {
                    console.error('Error loading image');
                    hideLoading();
                };
                
                currentImage.src = url;
            } catch (error) {
                console.error('Error loading file:', error);
                emptyState.innerHTML = `
                    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJkMmQyZCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIwIiBmaWxsPSIjM2QzZDNkIi8+PC9zdmc+" alt="Error">
                    <p>Error loading image</p>
                `;
                hideLoading();
            }
        }
        
        // Display image with current transformations
        function displayImage(src) {
            if (!imageDisplay.parentNode) {
                imageContainer.appendChild(imageDisplay);
                emptyState.style.display = 'none';
            }
            
            imageDisplay.src = src;
            updateTransformations();
        }
        
        // Update image transformations
        function updateTransformations() {
            const transform = [
                `scale(${zoomLevel})`,
                `rotate(${rotation}deg)`,
                flipX ? 'scaleX(-1)' : '',
                flipY ? 'scaleY(-1)' : ''
            ].filter(t => t).join(' ');
            
            imageDisplay.style.transform = transform;
        }
        
        // Update metadata display
        function updateMetadata(path, img) {
            const filename = path.split('/').pop();
            const size = (Math.random() * 5000000 + 100000).toFixed(0);
            const dimensions = `${img.naturalWidth} × ${img.naturalHeight}`;
            
            metadataElement.innerHTML = `
                <div><strong>File:</strong> ${filename}</div>
                <div><strong>Size:</strong> ${(size / 1024).toFixed(1)} KB</div>
                <div><strong>Dimensions:</strong> ${dimensions}</div>
            `;
        }
        
        // Show loading indicator
        function showLoading() {
            if (!document.querySelector('.loading')) {
                const loading = document.createElement('div');
                loading.className = 'loading';
                loading.innerHTML = '<div class="spinner"></div>';
                imageContainer.appendChild(loading);
            }
        }
        
        // Hide loading indicator
        function hideLoading() {
            const loading = document.querySelector('.loading');
            if (loading) {
                loading.remove();
            }
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Toolbar buttons
            rotateLeftBtn.addEventListener('click', () => {
                rotation = (rotation - 90) % 360;
                updateTransformations();
            });
            
            rotateRightBtn.addEventListener('click', () => {
                rotation = (rotation + 90) % 360;
                updateTransformations();
            });
            
            flipHorizontalBtn.addEventListener('click', () => {
                flipX = !flipX;
                updateTransformations();
            });
            
            flipVerticalBtn.addEventListener('click', () => {
                flipY = !flipY;
                updateTransformations();
            });
            
            zoomInBtn.addEventListener('click', () => {
                zoomLevel = Math.min(zoomLevel + 0.2, 3);
                updateTransformations();
            });
            
            zoomOutBtn.addEventListener('click', () => {
                zoomLevel = Math.max(zoomLevel - 0.2, 0.5);
                updateTransformations();
            });
            
            resetZoomBtn.addEventListener('click', () => {
                zoomLevel = 1;
                rotation = 0;
                flipX = false;
                flipY = false;
                updateTransformations();
            });
            
            saveBtn.addEventListener('click', async () => {
                if (!currentImage) return;
                
                try {
                    const newFilename = prompt('Enter filename for saved image:', 'modified_' + currentFile.split('/').pop());
                    if (!newFilename) return;
                    
                    // Create a canvas to apply transformations
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Set canvas dimensions based on image and transformations
                    let width = currentImage.naturalWidth;
                    let height = currentImage.naturalHeight;
                    
                    // Apply rotation effect to get correct dimensions
                    if (rotation % 180 !== 0) {
                        const rad = Math.abs(rotation * Math.PI / 180);
                        const newWidth = Math.abs(width * Math.cos(rad)) + Math.abs(height * Math.sin(rad));
                        const newHeight = Math.abs(width * Math.sin(rad)) + Math.abs(height * Math.cos(rad));
                        width = newWidth;
                        height = newHeight;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // Apply transformations
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(rotation * Math.PI / 180);
                    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
                    ctx.drawImage(currentImage, -currentImage.naturalWidth / 2, -currentImage.naturalHeight / 2);
                    ctx.restore();
                    
                    // Convert to blob and save
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    const arrayBuffer = await blob.arrayBuffer();
                    
                    await os.fs.write('/' + newFilename, arrayBuffer);
                    alert('Image saved successfully!');
                } catch (error) {
                    console.error('Error saving image:', error);
                    alert('Failed to save image');
                }
            });
            
            // Image dragging for panning
            imageDisplay.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                imageDisplay.classList.add('dragging');
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging || !currentImage) return;
                
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                
                // For panning, we'd normally move the image
                // But since we're using CSS transforms for zoom/rotate,
                // we'll just track the drag to prevent default behavior
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
                imageDisplay.classList.remove('dragging');
            });
        }
        
        // Populate sample files for testing outside OS
        function populateSampleFiles() {
            const sampleFiles = [
                { name: 'paint1.png', path: '/paint1.png' },
                { name: 'paint2.jpg', path: '/paint2.jpg' },
                { name: 'paint3.png', path: '/paint3.png' }
            ];
            
            renderFileList(sampleFiles);
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
