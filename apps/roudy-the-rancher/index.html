<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Roudy the Rancher</title><style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    background: linear-gradient(to bottom, #1a2980, #26d0ce);
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

#game-container {
    position: relative;
    width: 800px;
    height: 500px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    overflow: hidden;
}

#game-canvas {
    background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
    display: block;
}

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px;
    border-radius: 10px;
    font-size: 18px;
    display: flex;
    gap: 15px;
}

#start-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#start-screen h1 {
    font-size: 48px;
    color: #FFD700;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

#start-screen p {
    font-size: 24px;
    margin: 10px 0;
    text-align: center;
}

#start-btn {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 20px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    transition: all 0.2s;
}

#start-btn:hover {
    background: #FFA500;
    transform: scale(1.05);
}

#pause-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    padding: 8px 15px;
    font-size: 16px;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
}

#game-over {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    display: none;
}

#game-over h1 {
    font-size: 48px;
    color: #FFD700;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

#game-over p {
    font-size: 24px;
    margin: 10px 0;
}

#restart-btn {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 20px;
    background: #FFD700;
    color: #000;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    transition: all 0.2s;
}

#restart-btn:hover {
    background: #FFA500;
    transform: scale(1.05);
}

.coin {
    position: absolute;
    border-radius: 50%;
    z-index: 5;
}

.common-coin {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
    box-shadow: 0 0 8px #FFD700;
}

.medium-coin {
    width: 25px;
    height: 25px;
    background: radial-gradient(circle at 30% 30%, #C0C0C0, #A9A9A9);
    box-shadow: 0 0 8px #C0C0C0;
}

.rare-coin {
    width: 30px;
    height: 30px;
    background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
    box-shadow: 0 0 12px #FFD700;
}

.obstacle {
    position: absolute;
    z-index: 4;
}

.cactus {
    width: 30px;
    height: 60px;
    background: linear-gradient(to right, #228B22, #32CD32);
    border-radius: 5px 5px 0 0;
}

.rock {
    width: 40px;
    height: 30px;
    background: linear-gradient(to right, #696969, #808080);
    border-radius: 50%;
}

.spike {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid #8B4513;
}

</style></head><body><div id="game-container"><canvas id="game-canvas" width="800" height="500"></canvas><div id="hud"><div>Coins: <span id="coins">0</span></div><div>Time: <span id="time">0</span>s</div><div>Score: <span id="score">0</span></div></div><button id="pause-btn">⏸️ Pause</button><div id="start-screen"><h1>Roudy the Rancher</h1><p>Press Enter to Start</p><p>Space or Up Arrow to Jump</p><button id="start-btn">START GAME</button></div><div id="game-over"><h1>GAME OVER</h1><p>Your Score: <span id="final-score">0</span></p><p>Time Survived: <span id="final-time">0</span>s</p><p>Coins Collected: <span id="final-coins">0</span></p><button id="restart-btn">PLAY AGAIN</button></div></div><script>let canvas = document.getElementById('game-canvas');
let ctx = canvas.getContext('2d');
let coinsElement = document.getElementById('coins');
let timeElement = document.getElementById('time');
let scoreElement = document.getElementById('score');
let startScreen = document.getElementById('start-screen');
let gameOverScreen = document.getElementById('game-over');
let finalScoreElement = document.getElementById('final-score');
let finalTimeElement = document.getElementById('final-time');
let finalCoinsElement = document.getElementById('final-coins');
let startBtn = document.getElementById('start-btn');
let restartBtn = document.getElementById('restart-btn');
let pauseBtn = document.getElementById('pause-btn');

let gameRunning = false;
let gamePaused = false;
let score = 0;
let time = 0;
let coins = 0;
let highScore = 0;
let lastTime = 0;
let gameSpeed = 5;
let platforms = [];
let obstacles = [];
let coinsArray = [];

let player = {
    x: 100,
    y: 300,
    width: 40,
    height: 60,
    velocityY: 0,
    isJumping: false,
    jumpPower: 15,
    gravity: 0.8,
    color: '#8B4513'
};

function init() {
    if (window.os) {
        window.os.window.setTitle("Roudy the Rancher");
        window.os.window.resize(800, 500);
    }
    
    loadHighScore();
    
    document.addEventListener('keydown', handleKeyPress);
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    
    // Show start screen initially
    startScreen.style.display = 'flex';
    
    requestAnimationFrame(gameLoop);
}

async function loadHighScore() {
    if (window.os) {
        try {
            const saved = await window.os.storage.get('roudyHighScore');
            if (saved !== null) {
                highScore = parseInt(saved);
            }
        } catch (e) {
            console.error("Failed to load high score:", e);
        }
    }
}

async function saveHighScore() {
    if (window.os) {
        try {
            await window.os.storage.set('roudyHighScore', highScore.toString());
        } catch (e) {
            console.error("Failed to save high score:", e);
        }
    }
}

function startGame() {
    gameRunning = true;
    gamePaused = false;
    pauseBtn.textContent = '⏸️ Pause';
    
    score = 0;
    time = 0;
    coins = 0;
    gameSpeed = 5;
    platforms = [];
    obstacles = [];
    coinsArray = [];
    
    player.x = 100;
    player.y = 300;
    player.velocityY = 0;
    player.isJumping = false;
    
    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    
    platforms.push({x: 0, y: 400, width: 800, height: 100});
    platforms.push({x: 300, y: 350, width: 200, height: 20});
    platforms.push({x: 600, y: 300, width: 150, height: 20});
    
    updateHUD();
}

function togglePause() {
    if (!gameRunning) return;
    
    gamePaused = !gamePaused;
    pauseBtn.textContent = gamePaused ? '▶️ Resume' : '⏸️ Pause';
}

function handleKeyPress(e) {
    if (e.code === 'Enter') {
        if (!gameRunning) {
            startGame();
        }
    } else if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!player.isJumping && gameRunning && !gamePaused) {
            player.velocityY = -player.jumpPower;
            player.isJumping = true;
        }
    } else if (e.key === 'p' || e.key === 'P') {
        togglePause();
    }
}

function updateHUD() {
    coinsElement.textContent = coins;
    timeElement.textContent = Math.floor(time);
    scoreElement.textContent = Math.floor(score);
}

function createObstacle() {
    const types = ['cactus', 'rock', 'spike'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    let obstacle = {
        x: canvas.width,
        y: 0,
        width: 30,
        height: 60,
        type: type
    };
    
    if (type === 'cactus') {
        obstacle.height = 60;
        obstacle.y = 400 - obstacle.height;
    } else if (type === 'rock') {
        obstacle.width = 40;
        obstacle.height = 30;
        obstacle.y = 400 - obstacle.height;
    } else if (type === 'spike') {
        obstacle.width = 30;
        obstacle.height = 30;
        obstacle.y = 400 - obstacle.height;
    }
    
    obstacles.push(obstacle);
}

function createCoin() {
    const types = ['common', 'medium', 'rare'];
    const weights = [0.6, 0.3, 0.1];
    
    let rand = Math.random();
    let type = 'common';
    
    if (rand < weights[0]) {
        type = 'common';
    } else if (rand < weights[0] + weights[1]) {
        type = 'medium';
    } else {
        type = 'rare';
    }
    
    let coin = {
        x: canvas.width,
        y: 300 - Math.random() * 200,
        width: 20,
        height: 20,
        type: type,
        collected: false
    };
    
    if (type === 'medium') {
        coin.width = 25;
        coin.height = 25;
    } else if (type === 'rare') {
        coin.width = 30;
        coin.height = 30;
    }
    
    coinsArray.push(coin);
}

function update(deltaTime) {
    if (!gameRunning || gamePaused) return;
    
    time += deltaTime;
    score = Math.floor(time * coins);
    
    gameSpeed = 5 + Math.floor(time / 10) * 2;
    
    player.velocityY += player.gravity;
    player.y += player.velocityY;
    
    if (player.y > 340) {
        player.y = 340;
        player.velocityY = 0;
        player.isJumping = false;
    }
    
    for (let i = 0; i < platforms.length; i++) {
        platforms[i].x -= gameSpeed;
        
        if (platforms[i].x + platforms[i].width < 0) {
            platforms.splice(i, 1);
            i--;
        }
    }
    
    if (platforms.length < 3) {
        const lastPlatform = platforms[platforms.length - 1];
        platforms.push({
            x: lastPlatform.x + lastPlatform.width + Math.random() * 200 + 100,
            y: 400 - Math.random() * 100,
            width: 150 + Math.random() * 100,
            height: 20
        });
    }
    
    for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].x -= gameSpeed;
        
        if (
            player.x < obstacles[i].x + obstacles[i].width &&
            player.x + player.width > obstacles[i].x &&
            player.y < obstacles[i].y + obstacles[i].height &&
            player.y + player.height > obstacles[i].y
        ) {
            gameOver();
            return;
        }
        
        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
            i--;
        }
    }
    
    for (let i = 0; i < coinsArray.length; i++) {
        coinsArray[i].x -= gameSpeed;
        
        if (
            !coinsArray[i].collected &&
            player.x < coinsArray[i].x + coinsArray[i].width &&
            player.x + player.width > coinsArray[i].x &&
            player.y < coinsArray[i].y + coinsArray[i].height &&
            player.y + player.height > coinsArray[i].y
        ) {
            coinsArray[i].collected = true;
            coins++;
            
            let points = 1;
            if (coinsArray[i].type === 'medium') points = 5;
            else if (coinsArray[i].type === 'rare') points = 10;
            
            score += points;
            updateHUD();
        }
        
        if (coinsArray[i].x + coinsArray[i].width < 0) {
            coinsArray.splice(i, 1);
            i--;
        }
    }
    
    if (Math.random() < 0.02 + time * 0.0005) {
        createObstacle();
    }
    
    if (Math.random() < 0.03 + time * 0.0003) {
        createCoin();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#87CEEB');
    gradient.addColorStop(1, '#E0F7FA');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.beginPath();
    ctx.arc(700, 80, 50, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.beginPath();
    ctx.arc(100, 80, 30, 0, Math.PI * 2);
    ctx.arc(130, 70, 40, 0, Math.PI * 2);
    ctx.arc(160, 80, 30, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(500, 120, 30, 0, Math.PI * 2);
    ctx.arc(530, 110, 40, 0, Math.PI * 2);
    ctx.arc(560, 120, 30, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#8B4513';
    for (let platform of platforms) {
        ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
        
        ctx.fillStyle = '#228B22';
        ctx.fillRect(platform.x, platform.y, platform.width, 5);
        ctx.fillStyle = '#8B4513';
    }
    
    for (let obstacle of obstacles) {
        if (obstacle.type === 'cactus') {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            ctx.fillRect(obstacle.x - 5, obstacle.y + 10, 10, 15);
            ctx.fillRect(obstacle.x + obstacle.width - 5, obstacle.y + 20, 10, 15);
        } else if (obstacle.type === 'rock') {
            ctx.fillStyle = '#696969';
            ctx.beginPath();
            ctx.ellipse(obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2, 
                       obstacle.width/2, obstacle.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (obstacle.type === 'spike') {
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(obstacle.x, obstacle.y + obstacle.height);
            ctx.lineTo(obstacle.x + obstacle.width/2, obstacle.y);
            ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
            ctx.closePath();
            ctx.fill();
        }
    }
    
    for (let coin of coinsArray) {
        if (!coin.collected) {
            let color = '#FFD700';
            let glow = '#FFA500';
            
            if (coin.type === 'medium') {
                color = '#C0C0C0';
                glow = '#A9A9A9';
            } else if (coin.type === 'rare') {
                color = '#FFD700';
                glow = '#FFA500';
            }
            
            ctx.beginPath();
            ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(coin.x + coin.width/3, coin.y + coin.height/3, coin.width/6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();
        }
    }
    
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    ctx.fillStyle = '#333';
    ctx.fillRect(player.x - 5, player.y, player.width + 10, 10);
    ctx.fillRect(player.x + 5, player.y - 15, player.width - 10, 15);
    
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(player.x + 10, player.y + 20, 20, 10);
    
    ctx.fillStyle = 'black';
    ctx.fillRect(player.x + 15, player.y + 10, 5, 5);
    ctx.fillRect(player.x + 25, player.y + 10, 5, 5);
    
    ctx.fillRect(player.x - 5, player.y + 20, 5, 20);
    ctx.fillRect(player.x + player.width, player.y + 20, 5, 20);
    
    ctx.fillRect(player.x + 5, player.y + player.height, 10, 20);
    ctx.fillRect(player.x + player.width - 15, player.y + player.height, 10, 20);
}

function gameOver() {
    gameRunning = false;
    
    if (score > highScore) {
        highScore = score;
        saveHighScore();
    }
    
    finalScoreElement.textContent = Math.floor(score);
    finalTimeElement.textContent = Math.floor(time);
    finalCoinsElement.textContent = coins;
    gameOverScreen.style.display = 'flex';
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const deltaTime = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    
    update(deltaTime);
    draw();
    
    requestAnimationFrame(gameLoop);
}

window.onload = init;</script></body></html>
