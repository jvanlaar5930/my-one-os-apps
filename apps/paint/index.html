<!--APP {"name":"Paint","icon":"🎨"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#15161f;color:#eee;font-family:system-ui,Segoe UI,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:8px;background:#1c1e2b;flex-wrap:wrap}
.bar label{font-size:12px;display:flex;align-items:center;gap:5px}
button{border:none;border-radius:8px;padding:6px 11px;background:#2a2d40;color:#eee;cursor:pointer;font-size:13px}
button:hover{background:#363a52}button.active{background:#7c5cff;color:#fff}
canvas{flex:1;background:#fff;touch-action:none;cursor:crosshair;display:block}
input[type=range]{width:90px}
#msg{font-size:12px;opacity:.7}
</style></head><body>
<div class="bar">
<label>Color <input type="color" id="color" value="#7c5cff"></label>
<label>Size <input type="range" id="size" min="1" max="48" value="6"></label>
<button id="pen" class="active">Pen</button><button id="eraser">Eraser</button><button id="clear">Clear</button><button id="save">Save</button>
<span id="msg"></span></div>
<canvas id="c"></canvas>
<script>
var os=window.os;var c=document.getElementById('c'),ctx=c.getContext('2d');var drawing=false,erase=false,last=null;
function resize(){var w=c.clientWidth,h=c.clientHeight;var snap=document.createElement('canvas');snap.width=c.width||w;snap.height=c.height||h;if(c.width)snap.getContext('2d').drawImage(c,0,0);c.width=w;c.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(snap.width)ctx.drawImage(snap,0,0);}
window.addEventListener('resize',resize);
function pos(e){var r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
c.addEventListener('pointerdown',function(e){drawing=true;last=pos(e);});
c.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);ctx.strokeStyle=erase?'#fff':document.getElementById('color').value;ctx.lineWidth=document.getElementById('size').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
window.addEventListener('pointerup',function(){drawing=false;});
document.getElementById('pen').onclick=function(){erase=false;this.classList.add('active');document.getElementById('eraser').classList.remove('active');};
document.getElementById('eraser').onclick=function(){erase=true;this.classList.add('active');document.getElementById('pen').classList.remove('active');};
document.getElementById('clear').onclick=function(){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);};
function msg(t){document.getElementById('msg').textContent=t;setTimeout(function(){document.getElementById('msg').textContent='';},3000);}
document.getElementById('save').onclick=function(){var data=c.toDataURL('image/png');var name='/Documents/painting-'+Date.now()+'.png';if(os){os.fs.write(name,data).then(function(){msg('Saved to '+name);if(os.notify)os.notify('Painting saved');});}else{msg('Not running in one_OS');}};
setTimeout(resize,30);
</script></body></html>
