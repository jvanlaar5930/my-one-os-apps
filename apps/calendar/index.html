<!--APP {"name":"Calendar","icon":"📅"}-->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font-family:system-ui,Segoe UI,sans-serif;transition:background .2s,color .2s}
body.dark{background:#0f1018;color:#eee}body.light{background:#f5f6fa;color:#222}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(128,128,128,.3)}
header h1{font-size:15px;margin:0;flex:1;white-space:nowrap}
button{border:none;border-radius:8px;padding:6px 10px;cursor:pointer;background:rgba(128,128,128,.2);color:inherit;font-size:13px}
button:hover{background:rgba(128,128,128,.35)}
.seg{display:flex;border-radius:8px;overflow:hidden;background:rgba(128,128,128,.18)}
.seg button{border-radius:0;background:transparent;padding:6px 11px}
.seg button.active{background:#7c5cff;color:#fff}
.dow{font-size:11px;text-align:center;opacity:.6;padding:4px 0}
.dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 0}
.month{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:4px;padding:6px 10px 10px;flex:1}
.cell{border-radius:8px;padding:4px;background:rgba(128,128,128,.12);position:relative;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.cell.out{opacity:.4}
.cell .num{font-size:12px;font-weight:600}
.cell.today .num{color:#fff;background:#7c5cff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.add{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#7c5cff;color:#fff;opacity:0;font-size:14px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.cell:hover .add,.wcol:hover .add{opacity:1}
.chips{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.chip{font-size:11px;background:rgba(124,92,255,.35);border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip:hover{background:rgba(227,67,59,.6)}
.more{font-size:10px;opacity:.6}
.adder{font-size:11px;border:1px solid #7c5cff;border-radius:5px;background:rgba(0,0,0,.25);color:inherit;padding:2px 4px;width:100%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 10px 10px;flex:1}
.wcol{display:flex;flex-direction:column;background:rgba(128,128,128,.12);border-radius:8px;padding:6px;position:relative;overflow:hidden}
.wcol.today{outline:2px solid #7c5cff}
.whead{font-size:12px;font-weight:600;margin-bottom:6px}
.wevents{display:flex;flex-direction:column;gap:4px;overflow:auto}
.wrow{font-size:12px;background:rgba(124,92,255,.3);border-radius:6px;padding:4px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow:hover{background:rgba(227,67,59,.6)}
</style></head><body class="dark">
<header>
 <button id="prev">‹</button><button id="today">Today</button><button id="next">›</button>
 <h1 id="label"></h1>
 <div class="seg"><button id="mMonth" class="active">Month</button><button id="mWeek">Week</button></div>
 <button id="theme" title="Toggle theme">🌙</button>
</header>
<div class="dowrow" id="dowrow"></div>
<div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script>
var os=window.os;var mode='month';var cursor=new Date();var store={};var theme='dark';
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function key(dt){return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate();}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function startOfWeek(d){var x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;}
function save(){if(os)os.storage.set('events',store);}
function setTheme(t){theme=t;document.body.className=t;document.getElementById('theme').textContent=(t==='dark'?'🌙':'☀️');if(os)os.storage.set('theme',t);}
function load(){if(!os){setTheme('dark');return Promise.resolve();}return Promise.all([os.storage.get('events'),os.storage.get('theme')]).then(function(r){store=r[0]||{};setTheme(r[1]||'dark');});}
function addEvent(k,v){if(!v)return;store[k]=store[k]||[];store[k].push(v);save();render();}
function delEvent(k,i){if(window.confirm('Delete this event?')){store[k].splice(i,1);if(!store[k].length)delete store[k];save();render();}}
function openAdder(container,k){if(container.querySelector('.adder'))return;var inp=document.createElement('input');inp.className='adder';inp.placeholder='New event';var done=false;function commit(){if(done)return;done=true;addEvent(k,inp.value.trim());}inp.onkeydown=function(e){if(e.key==='Enter')commit();else if(e.key==='Escape'){done=true;render();}};inp.onblur=commit;container.appendChild(inp);inp.focus();}
function dowHeader(){var r=document.getElementById('dowrow');r.innerHTML='';for(var i=0;i<7;i++){var d=document.createElement('div');d.className='dow';d.textContent=DOW[i];r.appendChild(d);}}
function renderMonth(){
 var y=cursor.getFullYear(),m=cursor.getMonth();
 document.getElementById('label').textContent=cursor.toLocaleString(undefined,{month:'long'})+' '+y;
 var body=document.getElementById('body');body.innerHTML='';var grid=document.createElement('div');grid.className='month';body.appendChild(grid);
 var first=startOfWeek(new Date(y,m,1));var now=new Date();
 for(var i=0;i<42;i++){(function(){var dt=new Date(first);dt.setDate(first.getDate()+i);var k=key(dt);var cell=document.createElement('div');cell.className='cell'+(dt.getMonth()!==m?' out':'')+(sameDay(dt,now)?' today':'');
  var num=document.createElement('div');num.className='num';num.textContent=dt.getDate();cell.appendChild(num);
  var add=document.createElement('button');add.className='add';add.textContent='+';add.onclick=function(e){e.stopPropagation();openAdder(chips,k);};cell.appendChild(add);
  var chips=document.createElement('div');chips.className='chips';cell.appendChild(chips);
  var evs=store[k]||[];for(var j=0;j<evs.length&&j<3;j++){(function(j){var ch=document.createElement('div');ch.className='chip';ch.textContent=evs[j];ch.title=evs[j];ch.onclick=function(){delEvent(k,j);};chips.appendChild(ch);})(j);}
  if(evs.length>3){var mo=document.createElement('div');mo.className='more';mo.textContent='+'+(evs.length-3)+' more';chips.appendChild(mo);}
  grid.appendChild(cell);})();}
}
function renderWeek(){
 var sow=startOfWeek(cursor);var eow=new Date(sow);eow.setDate(sow.getDate()+6);
 document.getElementById('label').textContent=sow.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+eow.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
 var body=document.getElementById('body');body.innerHTML='';var grid=document.createElement('div');grid.className='week';body.appendChild(grid);var now=new Date();
 for(var i=0;i<7;i++){(function(){var dt=new Date(sow);dt.setDate(sow.getDate()+i);var k=key(dt);var col=document.createElement('div');col.className='wcol'+(sameDay(dt,now)?' today':'');
  var h=document.createElement('div');h.className='whead';h.textContent=DOW[i]+' '+dt.getDate();col.appendChild(h);
  var add=document.createElement('button');add.className='add';add.textContent='+';col.appendChild(add);
  var list=document.createElement('div');list.className='wevents';col.appendChild(list);
  add.onclick=function(e){e.stopPropagation();openAdder(list,k);};
  var evs=store[k]||[];for(var j=0;j<evs.length;j++){(function(j){var r=document.createElement('div');r.className='wrow';r.textContent=evs[j];r.title=evs[j];r.onclick=function(){delEvent(k,j);};list.appendChild(r);})(j);}
  grid.appendChild(col);})();}
}
function render(){document.getElementById('mMonth').classList.toggle('active',mode==='month');document.getElementById('mWeek').classList.toggle('active',mode==='week');if(mode==='month')renderMonth();else renderWeek();}
document.getElementById('prev').onclick=function(){if(mode==='month')cursor.setMonth(cursor.getMonth()-1);else cursor.setDate(cursor.getDate()-7);render();};
document.getElementById('next').onclick=function(){if(mode==='month')cursor.setMonth(cursor.getMonth()+1);else cursor.setDate(cursor.getDate()+7);render();};
document.getElementById('today').onclick=function(){cursor=new Date();render();};
document.getElementById('mMonth').onclick=function(){mode='month';render();};
document.getElementById('mWeek').onclick=function(){mode='week';render();};
document.getElementById('theme').onclick=function(){setTheme(theme==='dark'?'light':'dark');};
dowHeader();load().then(render);
</script></body></html>
